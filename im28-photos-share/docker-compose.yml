version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: im28-photos-share_web_1
      APP_PORT: 3000

  web:
    image: alangrainger/immich-public-proxy:4.1.2@sha256:d6480d1e6beb3da661cb895e1b368340df48904ecbfe53ece2d5da343e78b857
    restart: on-failure
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    environment:
      IMMICH_URL: http://immich_server_1:2283
      PUBLIC_BASE_URL: https://photos.tail31cf64.ts.net

  tailscale:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    restart: on-failure
    environment:
      TS_HOSTNAME: photos
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTHKEY: file:/var/lib/tailscale/authkey
      TS_EXTRA_ARGS: --advertise-tags=tag:photos-public
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${APP_DATA_DIR}/data/tailscale:/var/lib/tailscale
      - ${APP_DATA_DIR}/serve.json:/config/serve.json:ro
    depends_on:
      - web
